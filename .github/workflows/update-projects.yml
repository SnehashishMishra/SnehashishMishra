name: Update Latest Projects

on:
#  schedule:
#    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Repo List
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: repos
          feed_list: "https://github.com/SnehashishMishra.atom"
