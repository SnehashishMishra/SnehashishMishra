name: Update Project List

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Repo List
        uses: DenverCoder1/readme-repo-list@v1
        with:
          username: SnehashishMishra
          max_repos: 6
